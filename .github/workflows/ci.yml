name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: muqawil
          POSTGRES_PASSWORD: muqawil
          POSTGRES_DB: muqawil_partner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U muqawil -d muqawil_partner"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: muqawil
          MINIO_ROOT_PASSWORD: change-me
        ports: ['9000:9000']
        options: --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://muqawil:muqawil@localhost:5432/muqawil_partner
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: muqawil-documents
      S3_ACCESS_KEY: muqawil
      S3_SECRET_KEY: change-me
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:local
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: psql "$DATABASE_URL" -f database/seed.sql
      - run: npm run test:e2e
      - run: npm run build
