name: Bootstrap npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Refuse to overwrite an existing lockfile
        run: test ! -f package-lock.json || { echo 'package-lock.json already exists; use normal CI.'; exit 1; }
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Validate reproducible install
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run dependency-free baseline tests
        run: npm run test:local
      - name: Commit generated lockfile
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add reproducible npm lockfile'
          git push origin "HEAD:${BRANCH}"
