name: mostaofi-audit
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: disposable-audit-password
      POSTGRES_DB: mostaofi_audit_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U audit -d mostaofi_audit_test]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: audit
      AWS_SECRET_ACCESS_KEY: disposable-audit-s3-secret
      S3_BUCKET: muqawil-documents
  audit:
    build:
      context: .
      dockerfile: Dockerfile.audit
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://audit:disposable-audit-password@postgres:5432/mostaofi_audit_test
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_BUCKET: muqawil-documents
      S3_ACCESS_KEY: audit
      S3_SECRET_KEY: disposable-audit-s3-secret
      JWT_ACCESS_SECRET: disposable-audit-access-secret-000000000000000
      JWT_REFRESH_SECRET: disposable-audit-refresh-secret-00000000000000
      MOSTAOFI_RECOVERY_WORKER_DISABLED: 'true'
    volumes:
      - ./.audit-output:/app/.audit-output
