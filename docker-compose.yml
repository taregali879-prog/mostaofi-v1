services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: muqawil
      POSTGRES_PASSWORD: muqawil
      POSTGRES_DB: muqawil_partner
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muqawil -d muqawil_partner"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.2-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: muqawil
      MINIO_ROOT_PASSWORD: change-me
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata:
  miniodata:
