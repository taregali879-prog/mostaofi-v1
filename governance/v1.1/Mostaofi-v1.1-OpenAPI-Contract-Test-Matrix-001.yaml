erdConstraintRegistry:
  ERD-C001: كل سجل تشغيلي يحمل `tenant_id NOT NULL` وتطبق عليه RLS fail-closed.
  ERD-C002: كل FK مملوك لمستأجر tenant-aware؛ يمنع cross-tenant على مستوى قاعدة البيانات لا التطبيق فقط. Tenant المحتوى ذي
    الإصدارات يطابق أصله، مع سياسة global-or-same-tenant للروابط التشغيلية.
  ERD-C003: '`maintenance_contract`: `start_date < end_date`; القيم المالية والزيارات غير سالبة؛ `contract_value + vat_amount
    = total_value`; و`completed_visits <= planned_visits`.'
  ERD-C004: '`completed_visits` projection يحدّثه النظام من زيارات `COMPLETED` ذات النوع `PLANNED_MAINTENANCE` فقط ولا يقبل
    كتابة العميل؛ الزيارات التصحيحية والطارئة لا تستهلك العدد المخطط.'
  ERD-C005: '`UNIQUE (tenant_id, contract_number)` و`UNIQUE (tenant_id, work_order_number)` و`UNIQUE (tenant_id, report_number)`
    و`UNIQUE (tenant_id, invoice_number)`.'
  ERD-C006: '`UNIQUE (tenant_id, contract_id, site_id)` في contract-site؛ زيارة العقد وأصله وأمر عمله لا تستخدم موقعًا غير
    مغطى بالعقد.'
  ERD-C007: إذا كان `maintenance_asset.contract_id` غير NULL فيجب أن يكون موقع الأصل ضمن مواقع العقد.
  ERD-C008: '`UNIQUE (tenant_id, name, version)` في SLA؛ الأهداف الزمنية غير سالبة؛ والعقد يحتفظ بالسجل/الإصدار المشار إليه
    تاريخيًا.'
  ERD-C009: 'الزيارة: `scheduled_end > scheduled_start`, `visit_sequence >= 1`, `UNIQUE (tenant_id, contract_id, visit_sequence)`.'
  ERD-C010: '`previous_visit_id` من العقد والموقع نفسيهما، تسلسله السابق مباشرة، وله تابع واحد كحد أقصى؛ لا تتكون دورة self-reference.'
  ERD-C011: '`work_order.contract_id/site_id` يطابقان `visit`; و`contractor_id` يطابق مقاول العقد.'
  ERD-C012: لا يسند فني لأمر عمل تابع لمقاول آخر؛ `released_at >= assigned_at` و`accepted_at >= assigned_at`.
  ERD-C013: '`UNIQUE (tenant_id, template_id, version_number)`؛ نسخة `PUBLISHED` لا تعدل ولا تنشأ Inspection إلا منها.'
  ERD-C014: '`UNIQUE (tenant_id, inspection_id, inspection_item_id)`؛ عنصر الإجابة يجب أن ينتمي إلى نسخة قالب الفحص نفسها.'
  ERD-C015: 'نوع الإجابة يحدد التخزين: boolean لـPASS_FAIL/YES_NO، number لـNUMBER/READING، text لـTEXT، JSON array لـMULTI_SELECT،
    وEvidence مرتبط للإجابات PHOTO/VIDEO/SIGNATURE؛ يمنع التعارض بين الحقول.'
  ERD-C016: إكمال Inspection يتطلب إجابة كل عنصر إلزامي، وأدلة `FINALIZED` لأنواع الوسائط/التوقيع؛ والفشل الذي يشترط دليلًا
    يجب أن يملك Finding مطابقًا ودليلًا نهائيًا.
  ERD-C017: '`finding.inspection_id` يطابق WorkOrder؛ و`inspection_item_id`—إن وجد—ينتمي للفحص؛ والتصنيف اختياري.'
  ERD-C018: كل مرجع اختياري داخل Evidence، بما فيه `inspection_answer_id`، يطابق `work_order_id` والفحص نفسيهما. `UNIQUE (tenant_id,
    object_key)`؛ الإحداثيات ضمن نطاقها، والحجم/hash صالحان.
  ERD-C019: Evidence لا يصبح `FINALIZED` قبل اكتمال رفع ناجح ومطابقة SHA-256 وإنشاء IntegrityRecord؛ بعدها يمنع تعديل المفتاح/hash.
  ERD-C020: '`UNIQUE (tenant_id, finding_id, content_version_id)`؛ المحتوى المنشور عالمي أو من المستأجر نفسه.'
  ERD-C021: '`UNIQUE (tenant_id, training_module_id, content_version_id)` و`UNIQUE (tenant_id, enrollment_id, attempt_number)`؛
    Enrollment يتطلب `client_id` أو `user_id` على الأقل؛ ومحاولة جارية تسمح score/passed/completed_at = NULL.'
  ERD-C022: '`UNIQUE (tenant_id, proposal_number)` و`UNIQUE (tenant_id, proposal_id, version_number)`؛ `current_version_id`
    يجب أن ينتمي للعرض نفسه.'
  ERD-C023: نسخة العرض الحالية قابلة للتعديل في DRAFT فقط. بعد الإرسال أو الاستبدال أو الموافقة تصبح immutable.
  ERD-C024: '`subtotal + vat_amount = total_amount`; مبالغ وبنود العرض غير سالبة؛ مجموع البنود يصالح إجماليات النسخة.'
  ERD-C025: '`UNIQUE (tenant_id, proposal_version_id)` في ClientApproval؛ قرار `APPROVED` يعتمد النسخة كاملة ومبلغه يساوي
    total، وإلا يلزم إصدار جديد.'
  ERD-C026: لا توجد أكثر من نسخة APPROVED للعرض الواحد. أي تعديل بعد القرار ينشئ Version جديدة وقرارًا جديدًا.
  ERD-C027: '`UNIQUE (tenant_id, approval_id)` في ServiceExecution؛ التنفيذ لا يبدأ إلا بقرار `APPROVED` مطابق للنسخة وأمر
    العمل.'
  ERD-C028: كميات التنفيذ غير سالبة؛ `quantity_used + quantity_returned <= quantity_issued`; وInventoryItem—إن وجد—يطابق Product
    والمستأجر.
  ERD-C029: تقرير التنفيذ يطابق أمر عمل التنفيذ؛ تقرير `FINALIZED` immutable، ورقمه فريد للمستأجر. تقرير واحد لكل Execution،
    وتقرير inspection-only واحد لكل WorkOrder عندما يكون `execution_id` NULL.
  ERD-C030: '`UNIQUE (tenant_id, event_type, event_reference)` يمنع BillableEvent المكرر. مراجع المصدر—بما فيها TrainingEnrollment—تتوافق
    مع النوع والعميل والمستأجر؛ والزيارة المشمولة عقديًا لا تولد حدثًا قابلًا للفوترة.'
  ERD-C031: BillableEvent واحد لا يرتبط بأكثر من فاتورة غير VOID/CREDITED. إصدار الفاتورة يتطلب حدثًا واحدًا على الأقل ومصالحة
    المجموع والعملة والعميل.
  ERD-C032: '`paid_amount` و`outstanding_amount` projections للقراءة فقط: الأول مجموع reconciliations الفعالة، والثاني `total_amount
    - paid_amount`; و`0 <= paid_amount <= total_amount`.'
  ERD-C033: reversal لا يمحو reconciliation؛ يسجل حالة/قيدًا عكسيًا مدققًا ويحافظ على السجل التاريخي.
  ERD-C034: AuditEvent إلزامي لكل الأحداث الحساسة المحددة في §12 ولا يقبل UPDATE/DELETE.
  ERD-C035: DomainEvent يستخدم transactional outbox في المعاملة نفسها مع التغيير الحاكم، ويحفظ correlation/causation.
  ERD-C036: '`UNIQUE (tenant_id, actor_user_id, operation_scope, idempotency_key)`؛ إعادة المفتاح بنفس request hash تعيد النتيجة،
    وبـhash مختلف ترفض.'
  ERD-C037: لا hard delete بعد بدء دورة العمل؛ الإلغاء/التقاعد/void يتم بالحالات وبأثر تدقيقي.
