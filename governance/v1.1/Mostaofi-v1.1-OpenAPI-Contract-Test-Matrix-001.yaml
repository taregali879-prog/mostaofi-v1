freezeRule:
  specificationMayBecomeFrozenOnlyWhen:
  - Contract-test runner executes against the exact OpenAPI SHA-256 above.
  - Every required matrix profile that is executable at API level returns PASS.
  - ERD invariant tests that require DB/integration execution return PASS.
  - Evidence bundle includes runId, commitSha, environmentId, raw request/response/log artifacts and SHA-256.
  - Any FAIL/BLOCKED/UNKNOWN/MISSING/SKIPPED remains fail-closed.
testProfileDefinitions:
  SUCCESS_RESPONSE_CONFORMANCE: Expected success status and response schema conform to the exact operation contract.
  AUTHENTICATION_REQUIRED: Missing/invalid authentication is rejected with canonical ErrorResponse.
  RBAC_DENY: A principal outside x-rbac is rejected.
  TENANT_ISOLATION: Cross-tenant access is rejected; tenant header is context only and cannot override authenticated scope.
  ERROR_ENVELOPE_CONFORMANCE: All declared error responses resolve to the canonical ErrorResponse envelope.
  IDEMPOTENCY_REPLAY: Same key + same request hash replays stored result without duplicate side effects.
  IDEMPOTENCY_KEY_REUSE_CONFLICT: Same key + changed request hash is rejected with 409.
  IF_MATCH_REQUIRED: Protected mutations require If-Match and reject missing precondition as declared.
  STALE_IF_MATCH_CONFLICT: Stale If-Match is rejected with 409 CONCURRENT_MODIFICATION.
  AUDIT_EVENT_EMITTED: The declared x-audit-event is persisted with required actor/tenant/correlation context.
  DOMAIN_EVENT_OUTBOX: Declared domain event is recorded transactionally in the outbox with correlation/causation.
