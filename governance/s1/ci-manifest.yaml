unlockRule:
  S1_SPECIFICATION: FROZEN only after G01 PASS against the exact canonical spec digest used by CI.
  S1_IMPLEMENTATION: PASS only when G01..G10 are PASS and all required CTs are PASS with verified evidence.
  S2_UNLOCKED: S1_IMPLEMENTATION == PASS
  failClosed: Any FAIL/BLOCKED/UNKNOWN/MISSING/SKIPPED, governance coverage gap, missing evidence, or SHA-256 mismatch keeps
    S2_UNLOCKED=false.
governanceBaseline:
  id: MOSTAOFI-V1.1-S1-GOVERNANCE-MATRIX-001
  scope: S1
  decisionModel: FAIL_CLOSED
  rule: Every G01..G10 gate must be COVERED and PASS; every required mapped CT must PASS with integrity-verifiable evidence.
  nonPassStates:
  - FAIL
  - BLOCKED
  - UNKNOWN
  - MISSING
  - SKIPPED
  traceability: Requirement -> OpenAPI Rule -> Gate -> Contract Test -> CI Execution -> Evidence Artifact + SHA-256 -> PASS/FAIL
