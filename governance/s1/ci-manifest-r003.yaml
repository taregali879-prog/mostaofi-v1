unlockRule:
  IMPLEMENTATION_START_UNLOCK: TRUE only when implementationStartPolicy requirements are satisfied. This authorizes controlled
    development only.
  S1_SPECIFICATION: FROZEN only after G01 PASS against the exact canonical spec digest used by CI and final-freeze requirements
    are satisfied.
  SPRINT_ACCEPTANCE: PASS only when the sprint-mapped required CTs and ERD invariants are PASS_EVIDENCED with verified evidence
    and exact commit binding.
  S2_IMPLEMENTATION_ALLOWED: IMPLEMENTATION_START_UNLOCK == TRUE
  S2_ACCEPTANCE_UNLOCKED: S1 SPRINT_ACCEPTANCE == PASS
  OPENAPI_FINAL_FREEZE: TRUE only when openApiFinalFreezePolicy requirements are satisfied.
  failClosedAcceptance: Any FAIL/BLOCKED/UNKNOWN/MISSING/SKIPPED, governance coverage gap, missing evidence, or SHA-256 mismatch
    keeps sprint acceptance and final freeze false; it does not revoke a separately valid implementation-start decision.
