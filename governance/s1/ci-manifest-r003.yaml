  id: MOSTAOFI-V1.1-S1-GOVERNANCE-MATRIX-001
  scope: S1
  decisionModel: SPLIT_START_AND_FAIL_CLOSED_ACCEPTANCE
  implementationStartRule: Controlled development may start under implementationStartPolicy before runtime CT acceptance evidence
    exists.
  acceptanceRule: Every required acceptance gate must be COVERED and PASS; every required mapped CT must PASS with integrity-verifiable
    evidence.
