manifestVersion: '3.0'
name: Mostaofi v1.1 S1 CI Execution Manifest — S0-Accepted / Registry R002 / Evidence R003
specification: spec/s1/openapi.yaml
status: FROZEN_SPECIFICATION_CANDIDATE
failurePolicy:
  passValues:
  - PASS
  nonPassValues:
  - FAIL
  - BLOCKED
  - UNKNOWN
  - MISSING
  - SKIPPED
  rule: Every required acceptance gate and required test must PASS for sprint acceptance/final freeze. Non-PASS runtime states
    do not by themselves block controlled implementation start.
implementationStartPolicy:
  revision: MOSTAOFI-V1.1-GATE-SEPARATION-R001
  purpose: Authorize controlled S0-S10 implementation without pretending runtime acceptance evidence already exists.
  requires:
  - ERD baseline frozen and exact digest verified
  - OpenAPI candidate exact digest bound and static validation PASS
  - no baseline drift
  - source commit bound and working tree clean
  - Test Registry R002 adopted with complete gate coverage
  - governance audit PASS
  - development toolchain ready
  doesNotRequire:
  - G01..G10 runtime PASS
  - all Contract Tests PASS_EVIDENCED
  effect: Allows development only; does not authorize sprint acceptance, OpenAPI final freeze, release, deployment, or pilot.
sprintAcceptancePolicy:
  failureMode: fail-closed
  requires:
  - all required Contract Tests mapped to the sprint PASS_EVIDENCED
  - relevant ERD DB/integration invariants PASS_EVIDENCED
  - evidence integrity VERIFIED
  - tested commit equals authorized commit
  - governance audit PASS
  - no baseline drift
openApiFinalFreezePolicy:
  failureMode: fail-closed
  requires:
  - all adopted Contract Tests PASS_EVIDENCED
  - G01..G10 PASS
  - all required ERD DB/integration invariants PASS_EVIDENCED
  - evidence integrity VERIFIED
  - tested commit equals authorized commit
  - governance audit PASS
  - no baseline drift
  effect: Freezes the OpenAPI candidate only; release/pilot still requires the separate release governance decision.
