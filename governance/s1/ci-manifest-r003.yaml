      result: evidence/s1/tests/S1-CT-001/result.json
      request: evidence/s1/tests/S1-CT-001/request.json
      response: evidence/s1/tests/S1-CT-001/response.json
      log: evidence/s1/tests/S1-CT-001/execution.log
      integrity: evidence/s1/tests/S1-CT-001/sha256.txt
    requiredEvidenceFields:
    - testId
    - gateIds
    - status
    - startedAtUtc
