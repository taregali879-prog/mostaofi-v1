      - RECONCILIATION_EXCEEDS_OUTSTANDING
      - DEPENDENCY_UNAVAILABLE
      - RATE_LIMITED
      - INTERNAL_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            status:
              type: integer
              format: int64
            requestId:
              type: string
              format: uuid
            correlationId:
              type: string
              format: uuid
              nullable: true
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
          required:
          - code
          - message
          - status
          - requestId
          - details
      required:
