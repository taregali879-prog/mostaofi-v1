openapi: 3.0.3
info:
  title: Mostaofi Maintenance & Corrective Services API
  version: 1.1.0
  description: Canonical API contract derived from the frozen Mostaofi v1.1 ERD. Covers maintenance contracts, visits, work
    orders, inspections, findings, immutable evidence, Waa'iyah, training, corrective proposals, approval, execution, reports,
    billing, and collection.
  x-baseline-id: MOSTAOFI-V1.1-OPENAPI-BASELINE-001
  x-status: FROZEN_SPECIFICATION_CANDIDATE
  x-derived-from-erd:
    baselineId: MOSTAOFI-V1.1-ERD-BASELINE-001
    sha256: cd57b2b76fee1b962e0a16991414181ea4743004b3065de2ef0376b0f93d6f31
  x-supersedes: mostaofi-v1.1-s1-openapi-FROZEN.yaml after acceptance
  x-compatibility:
    preservedS1Operations: 20
    schemaRealignments:
    - SLA is represented by immutable version rows as defined by sla_policy in ERD Baseline 001.
    - Contract scope uses included plus visitLimit instead of the earlier non-ERD ScopeCoverage shape.
    - Contract monetary responses expose contractValue, vatAmount, and totalValue as decimal strings.
servers:
- url: https://api.mostaofi.example
  description: Environment-specific base URL
security:
- bearerAuth: []
tags:
- name: Technicians
  description: Technicians and qualifications
- name: SLA
  description: Versioned SLA policies
- name: Contracts
  description: Maintenance contracts, sites, scopes, and lifecycle
- name: Assets
  description: Maintenance asset register
- name: Visits
  description: Scheduled, call-out, follow-up, and revisit records
- name: Work Orders
  description: Work orders, assignments, and lifecycle commands
- name: Inspection Templates
  description: Versioned inspection checklist definitions
- name: Inspections
  description: Inspection instances and typed answers
- name: Findings
  description: Findings and optional regulatory classification
- name: Evidence
  description: Object-storage evidence upload and integrity
- name: Waa'iyah
  description: Awareness content and finding mappings
- name: Training
  description: Training modules, enrollments, and attempts
- name: Corrective Proposals
  description: Versioned corrective proposals and client decisions
- name: Execution
  description: Authorized service execution, tasks, and materials
- name: Reports
  description: Completion report generation and finalization
- name: Billing
  description: Billable events, invoices, and payment reconciliation
- name: Governance
  description: Read-only audit and domain event access
