components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantContext:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Requested tenant context. Tenant authority is always derived from the authenticated principal.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Stable key scoped to tenant, actor, and operation. Same key with changed request hash is rejected.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Current aggregate ETag for optimistic concurrency.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 400
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 401
    Forbidden:
      description: RBAC, tenant scope, or ownership violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 403
    NotFound:
      description: Resource not found in authorized scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 404
    Conflict:
      description: State, concurrency, uniqueness, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 409
    Unprocessable:
      description: Business validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 422
    PreconditionRequired:
      description: If-Match header is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 428
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 429
    DependencyUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      x-http-status: 503
  schemas:
    UUID:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    MoneyAmount:
      type: string
      pattern: ^-?(0|[1-9]\d{0,18})(\.\d{1,4})?$
      description: Decimal monetary amount. Never encoded as JSON float.
      example: '1250.0000'
    NonNegativeMoneyAmount:
      type: string
      pattern: ^(0|[1-9]\d{0,18})(\.\d{1,4})?$
      example: '1250.0000'
    Quantity:
      type: string
      pattern: ^(0|[1-9]\d{0,18})(\.\d{1,4})?$
      example: '2.5000'
    Score:
      type: number
      format: double
      minimum: 0
      maximum: 100
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      example: SAR
    Sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    BaseEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - id
      - tenantId
      - createdAt
      - updatedAt
    GlobalBaseEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - id
      - createdAt
      - updatedAt
    PaginationMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
        pageSize:
          type: integer
          format: int64
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
        requestId:
          type: string
          format: uuid
        nextPage:
          type: integer
          format: int64
          nullable: true
          minimum: 1
      required:
      - page
      - pageSize
      - total
      - requestId
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
          nullable: true
      required:
      - code
      - message
    ErrorCode:
      type: string
      enum:
      - AUTHENTICATION_REQUIRED
      - FORBIDDEN
      - TENANT_SCOPE_VIOLATION
      - ENTITY_OWNERSHIP_VIOLATION
      - RESOURCE_NOT_FOUND
      - VALIDATION_FAILED
      - INVALID_STATE_TRANSITION
      - CONCURRENT_MODIFICATION
      - PRECONDITION_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      - DUPLICATE_RESOURCE
      - HISTORICAL_DATA_PROTECTED
      - IMMUTABLE_VERSION
      - CONTRACT_NOT_READY
      - INVALID_DATES
