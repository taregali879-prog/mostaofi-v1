x-rbac-roles:
  PLATFORM_ADMIN: Global platform administration
  TENANT_ADMIN: Tenant administration
  OPERATIONS_MANAGER: Maintenance operations control
  CONTRACT_MANAGER: Contracts and SLA management
  DISPATCHER: Scheduling, work-order dispatch, and assignment
  TECHNICIAN: Assigned field execution within owned work orders
  INSPECTOR: Inspection, finding, and evidence duties
  CLIENT_APPROVER: Client-side proposal and report decisions
  CLIENT_USER: Read and complete client-owned maintenance, awareness, training, report, and invoice actions
  CONTENT_EDITOR: Draft Waa'iyah and training content
  CONTENT_REVIEWER: Technical content review
  COMPLIANCE_REVIEWER: Compliance approval and publication
  FINANCE: Billable events, invoices, and reconciliation
  AUDITOR: Read-only audit and domain event access
x-authorization-rules:
  tenantAuthority: Effective tenant is derived from JWT claims; X-Tenant-Id can only request an already-authorized context.
  clientOwnership: CLIENT_USER and CLIENT_APPROVER may access only records whose clientId is bound to their authenticated
    client membership.
  technicianOwnership: TECHNICIAN may mutate only assigned work orders, inspections, evidence, executions, tasks, and training
    attempts permitted by assignment.
  contractorOwnership: Operational users are restricted to contractor/site scope granted by tenant membership and assignment.
  crossTenantReads: Return 404 when disclosure of existence would cross tenant scope.
  crossTenantWrites: Reject referenced cross-tenant writes with 403 TENANT_SCOPE_VIOLATION.
x-lifecycle-contracts:
  MaintenanceContract:
    initial: DRAFT
    transitions:
    - DRAFT->PENDING_APPROVAL
    - PENDING_APPROVAL->ACTIVE
    - ACTIVE->SUSPENDED
    - SUSPENDED->ACTIVE
    - ACTIVE->EXPIRING
    - EXPIRING->EXPIRED
    - ACTIVE|SUSPENDED|EXPIRING->TERMINATED
    - EXPIRED|TERMINATED->CLOSED
  MaintenanceVisit:
    initial: PLANNED
    transitions:
    - PLANNED->SCHEDULED
    - SCHEDULED->CONFIRMED
    - CONFIRMED|SCHEDULED->ARRIVED
    - ARRIVED->IN_PROGRESS
    - IN_PROGRESS->COMPLETED
    - PLANNED|SCHEDULED|CONFIRMED->RESCHEDULE_REQUIRED
    - SCHEDULED|CONFIRMED->NO_SHOW
    - PLANNED|SCHEDULED|CONFIRMED->CANCELLED
  WorkOrder:
    initial: DRAFT
    transitions:
    - DRAFT->PENDING_ASSIGNMENT
    - PENDING_ASSIGNMENT->ASSIGNED
    - ASSIGNED->ACCEPTED
    - ACCEPTED->EN_ROUTE
    - EN_ROUTE->ARRIVED
    - ARRIVED->IN_PROGRESS
    - IN_PROGRESS->INSPECTION_COMPLETED
    - INSPECTION_COMPLETED->ACTION_REQUIRED|REPORT_PENDING
    - ACTION_REQUIRED->CLIENT_APPROVAL_PENDING
    - CLIENT_APPROVAL_PENDING->APPROVED
    - APPROVED->EXECUTION_IN_PROGRESS
    - EXECUTION_IN_PROGRESS->COMPLETED
    - COMPLETED->REPORT_PENDING
    - REPORT_PENDING->CLOSED
    - nonterminal->ON_HOLD|REVISIT_REQUIRED|REJECTED|CANCELLED
  Inspection:
    initial: DRAFT
    transitions:
    - DRAFT->IN_PROGRESS
    - IN_PROGRESS->COMPLETED
    - DRAFT|IN_PROGRESS->VOIDED
  Evidence:
    initial: PENDING_UPLOAD
    transitions:
    - PENDING_UPLOAD->VALIDATING
    - VALIDATING->FINALIZED|QUARANTINED|REJECTED
  WaaContentVersion:
    initial: DRAFT
    transitions:
    - DRAFT->TECHNICAL_REVIEW
    - TECHNICAL_REVIEW->COMPLIANCE_REVIEW
    - COMPLIANCE_REVIEW->APPROVED
    - APPROVED->PUBLISHED
    - PUBLISHED->RETIRED
  CorrectiveActionProposal:
    initial: DRAFT
    transitions:
    - DRAFT->SENT
    - SENT->VIEWED
    - SENT|VIEWED->REVISION_REQUESTED|APPROVED|REJECTED|EXPIRED|CANCELLED
  ServiceExecution:
    initial: PENDING_AUTHORIZATION
    transitions:
    - PENDING_AUTHORIZATION->AUTHORIZED
    - AUTHORIZED->SCHEDULED
    - AUTHORIZED|SCHEDULED->IN_PROGRESS
    - IN_PROGRESS->COMPLETED|FAILED
    - nonterminal->CANCELLED
  CompletionReport:
    initial: DRAFT
    transitions:
    - DRAFT->GENERATED
    - GENERATED->TECHNICIAN_SIGNED
    - TECHNICIAN_SIGNED->CLIENT_ACKNOWLEDGED
    - CLIENT_ACKNOWLEDGED->FINALIZED
  Invoice:
    initial: DRAFT
    transitions:
    - DRAFT->ISSUED
    - ISSUED->PARTIALLY_PAID|PAID|OVERDUE|VOID
    - PARTIALLY_PAID|OVERDUE->PAID|VOID
    - ISSUED|PARTIALLY_PAID|PAID|OVERDUE->CREDITED
x-error-contract:
  format: '#/components/schemas/ErrorResponse'
  readIsolation: Cross-tenant reads return 404 when needed to prevent existence disclosure.
  writeIsolation: Cross-tenant referenced writes return 403 TENANT_SCOPE_VIOLATION.
  validation: Business rule failures return 422 with field-level details when available.
  concurrency: Stale If-Match returns 409 CONCURRENT_MODIFICATION; missing If-Match returns 428.
  idempotency: Changed request under an existing key returns 409 IDEMPOTENCY_KEY_REUSED.
