x-governance:
  tenantAuthority: Authenticated principal; X-Tenant-Id is optional requested context only.
  scopeCoverageRules:
    INCLUDED: visitLimit optional
    LIMITED: at least one applicable limit required; in S1 visitLimit is the supported limit field
    CONDITIONAL: coverageConditions required
    EXCLUDED: no included-service entitlement
  slaBinding: MaintenanceContract binds slaPolicyVersionId; ACTIVE+ replacement requires amendment.
  completedVisits: Projection from completed MaintenanceVisit records starting S2; never an independently editable source
    of truth.
  siteHistory: After activation no hard delete; deactivate or amendment only.
  repeatCommandPolicy:
    activate(ACTIVE): 200 safe/no-op
    suspend(SUSPENDED): 200 safe/no-op
    terminate(TERMINATED): 200 safe/no-op
    close(CLOSED): 200 safe/no-op
    illegal_transition: 409 INVALID_STATE_TRANSITION
  idempotency: Same actor + effective tenant + method + canonical path + key + same request hash replays original result;
    changed request hash returns 409 IDEMPOTENCY_KEY_REUSED.
  concurrency: GET returns ETag; mutating contract commands use If-Match; stale ETag returns 409 CONCURRENT_MODIFICATION.
