openapi: 3.0.3
info:
  title: Mostaofi Maintenance Contracts API — S1 Frozen Specification
  version: 1.1.0
  description: S1 — Maintenance Contract + Sites + Scope + SLA + Lifecycle + Contract 360. Frozen implementation contract
    for CI contract testing.
servers:
- url: https://api.example.com
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantContext:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional requested tenant context for authorized multi-tenant users. Never trusted as tenant authority;
        server validates it against the authenticated principal.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag/version for optimistic concurrency, e.g. "17".
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScopeId:
      name: scopeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SLAPolicyId:
      name: slaPolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    ContractStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - ACTIVE
      - SUSPENDED
      - EXPIRING
      - EXPIRED
      - TERMINATED
      - CLOSED
    ScopeCoverage:
      type: string
      enum:
      - INCLUDED
      - EXCLUDED
      - LIMITED
      - CONDITIONAL
    MoneyAmount:
      type: string
      pattern: ^(0|[1-9]\d{0,15})(\.\d{1,2})?$
      example: '10000.00'
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: SAR
    VisitFrequency:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - MONTH
          - WEEK
          - DAY
        value:
          type: integer
          minimum: 1
      required:
      - type
      - value
    PartySummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required:
      - id
      - displayName
    VisitSummary:
      type: object
      additionalProperties: false
      properties:
        planned:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
      required:
      - planned
      - completed
      - remaining
    ContractFinancialSummary:
      type: object
      additionalProperties: false
      properties:
        contractValue:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - contractValue
      - currency
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
            requestId:
              type: string
              format: uuid
            correlationId:
              type: string
              format: uuid
              nullable: true
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
          required:
          - code
          - message
          - status
          - requestId
      required:
      - error
    MaintenanceContractCreateRequest:
      type: object
      additionalProperties: false
      properties:
        clientId:
          type: string
          format: uuid
        contractorId:
          type: string
          format: uuid
        contractType:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        plannedVisits:
          type: integer
          minimum: 0
        visitFrequency:
          $ref: '#/components/schemas/VisitFrequency'
        contractValue:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - clientId
      - contractorId
      - contractType
      - startDate
      - endDate
      - plannedVisits
      - visitFrequency
      - contractValue
      - currency
    MaintenanceContract:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          readOnly: true
        contractNumber:
          type: string
          readOnly: true
        clientId:
          type: string
          format: uuid
        contractorId:
          type: string
          format: uuid
        contractType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        plannedVisits:
          type: integer
          minimum: 0
        completedVisits:
          type: integer
          minimum: 0
          readOnly: true
          description: Projection from MaintenanceVisit COMPLETED count in S2+.
        visitFrequency:
          $ref: '#/components/schemas/VisitFrequency'
        contractValue:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/ContractStatus'
        slaPolicyVersionId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
          readOnly: true
      required:
      - id
      - tenantId
      - contractNumber
      - clientId
      - contractorId
      - contractType
      - startDate
      - endDate
      - plannedVisits
      - completedVisits
      - visitFrequency
      - contractValue
      - currency
      - status
      - version
    MaintenanceContractSiteCreateRequest:
      type: object
      additionalProperties: false
      properties:
        siteId:
          type: string
          format: uuid
      required:
      - siteId
    MaintenanceContractSite:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - id
      - contractId
      - siteId
      - status
    MaintenanceContractScopeCreateRequest:
      type: object
      additionalProperties: false
      properties:
        scopeCategory:
          type: string
          minLength: 1
        serviceType:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/ScopeCoverage'
        visitLimit:
          type: integer
          minimum: 0
          nullable: true
        coverageConditions:
          type: object
          nullable: true
          additionalProperties: true
      required:
      - scopeCategory
      - serviceType
      - description
      - coverage
    MaintenanceContractScopePatchRequest:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
        coverage:
          $ref: '#/components/schemas/ScopeCoverage'
        visitLimit:
          type: integer
          minimum: 0
          nullable: true
        coverageConditions:
          type: object
          nullable: true
          additionalProperties: true
      minProperties: 1
    MaintenanceContractScope:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        scopeCategory:
          type: string
        serviceType:
          type: string
        description:
          type: string
        coverage:
          $ref: '#/components/schemas/ScopeCoverage'
        visitLimit:
          type: integer
          minimum: 0
          nullable: true
        coverageConditions:
          type: object
          nullable: true
          additionalProperties: true
      required:
      - id
      - contractId
      - scopeCategory
      - serviceType
      - description
      - coverage
    SLAPolicyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          example: Asia/Riyadh
        workingHoursPolicy:
          type: object
          additionalProperties: true
      required:
      - name
      - timezone
    SLAPolicy:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        workingHoursPolicy:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - timezone
      - createdAt
    SLAPolicyVersionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        responseTargetMinutes:
          type: integer
          minimum: 0
        arrivalTargetMinutes:
          type: integer
          minimum: 0
        resolutionTargetMinutes:
          type: integer
          minimum: 0
        escalationThresholdMinutes:
          type: integer
          minimum: 0
          nullable: true
        severityRules:
          type: object
          additionalProperties: true
        effectiveFrom:
          type: string
          format: date
      required:
      - responseTargetMinutes
      - arrivalTargetMinutes
      - resolutionTargetMinutes
      - effectiveFrom
    SLAPolicyVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        slaPolicyId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          readOnly: true
        responseTargetMinutes:
          type: integer
          minimum: 0
        arrivalTargetMinutes:
          type: integer
          minimum: 0
        resolutionTargetMinutes:
          type: integer
          minimum: 0
        escalationThresholdMinutes:
          type: integer
          minimum: 0
          nullable: true
        severityRules:
          type: object
          additionalProperties: true
        effectiveFrom:
          type: string
          format: date
        immutable:
          type: boolean
          readOnly: true
      required:
      - id
      - slaPolicyId
      - version
      - responseTargetMinutes
      - arrivalTargetMinutes
      - resolutionTargetMinutes
      - effectiveFrom
      - immutable
    AssignSLARequest:
      type: object
      additionalProperties: false
      properties:
        slaPolicyVersionId:
          type: string
          format: uuid
      required:
      - slaPolicyVersionId
    ContractTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          minLength: 1
        reason:
          type: string
          maxLength: 1000
      required:
      - reasonCode
    Contract360:
      type: object
      additionalProperties: false
      properties:
        contract:
          $ref: '#/components/schemas/MaintenanceContract'
        client:
          $ref: '#/components/schemas/PartySummary'
        contractor:
          $ref: '#/components/schemas/PartySummary'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceContractSite'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceContractScope'
        sla:
          $ref: '#/components/schemas/SLAPolicyVersion'
        visitSummary:
          $ref: '#/components/schemas/VisitSummary'
        financialSummary:
          $ref: '#/components/schemas/ContractFinancialSummary'
        status:
          $ref: '#/components/schemas/ContractStatus'
      required:
      - contract
      - client
      - contractor
      - sites
      - scopes
      - sla
      - visitSummary
      - financialSummary
      - status
    PaginationMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        requestId:
          type: string
          format: uuid
      required:
      - page
      - pageSize
      - total
      - requestId
    MaintenanceContractListResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceContract'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - data
      - meta
paths:
  /api/v1/maintenance/contracts:
    post:
      summary: Create maintenance contract
      security: &id001
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceContractCreateRequest'
      responses:
        '201':
          description: Contract created
          headers:
            ETag:
              schema:
                type: string
              description: Current contract version ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContract'
        '403':
          description: RBAC, tenant scope, or ownership violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Contract number or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List maintenance contracts
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ContractStatus'
      responses:
        '200':
          description: Contracts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractListResponse'
        '403':
          description: RBAC or tenant scope violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}:
    get:
      summary: Get maintenance contract
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Contract
          headers:
            ETag:
              schema:
                type: string
              description: Current contract version ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContract'
        '404':
          description: Contract not found or not visible in authorized context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}/sites:
    post:
      summary: Add site to contract
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceContractSiteCreateRequest'
      responses:
        '201':
          description: Site added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractSite'
        '403':
          description: Cross-tenant or RBAC violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate site, concurrency, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Contract not modifiable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List contract sites
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceContractSite'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}/sites/{siteId}/deactivate:
    post:
      summary: Deactivate contract site
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site deactivated; repeated command is safe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractSite'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrency, idempotency, or protected historical state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}/scopes:
    post:
      summary: Add contract scope
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceContractScopeCreateRequest'
      responses:
        '201':
          description: Scope added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractScope'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrency/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid scope configuration or coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List contract scopes
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Scopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceContractScope'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}/scopes/{scopeId}:
    patch:
      summary: Update contract scope while directly modifiable
      description: Direct scope mutation is allowed only while governance permits. ACTIVE+ contracts require amendment and
        return CONTRACT_SCOPE_AMENDMENT_REQUIRED.
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/ScopeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceContractScopePatchRequest'
      responses:
        '200':
          description: Scope updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContractScope'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: CONTRACT_SCOPE_AMENDMENT_REQUIRED, historical protection, concurrency, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid coverage configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/sla-policies:
    post:
      summary: Create SLA policy
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLAPolicyCreateRequest'
      responses:
        '201':
          description: SLA policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPolicy'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid SLA policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List SLA policies
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: SLA policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SLAPolicy'
  /api/v1/maintenance/sla-policies/{slaPolicyId}/versions:
    post:
      summary: Create SLA policy version
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/SLAPolicyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLAPolicyVersionCreateRequest'
      responses:
        '201':
          description: SLA version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPolicyVersion'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid SLA version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/maintenance/contracts/{contractId}/sla:
    post:
      summary: Assign SLA policy version to contract
      description: ACTIVE+ contracts cannot replace the bound SLA version directly; use amendment governance.
      security: *id001
      parameters:
      - $ref: '#/components/parameters/TenantContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSLARequest'
      responses:
        '200':
          description: SLA version assigned
          headers:
            ETag:
              schema:
                type: string
              description: Current contract version ETag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceContract'
        '403':
          description: RBAC/tenant violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: SLA_AMENDMENT_REQUIRED, concurrency, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: SLA version invalid or not effective
          content:
            application/json:
              schema:
